[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hmm-regimes-crypto"
version = "0.1.0"
description = "Regime detection for BTC using HMMs with free crypto data feeds."
authors = [
  { name = "Jaden Fix" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "requests>=2.31",
  "hmmlearn>=0.3",
  "scikit-learn>=1.3",
  "arch>=6.3",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "plotly>=5.18",
  "pydantic>=2.5",
  "pydantic-settings>=2.0",
  "typer[all]>=0.9",
  "joblib>=1.3",
  "pyarrow>=14.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "black>=23.9",
  "ruff>=0.1.6",
  "isort>=5.12"
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "B", "I", "UP", "N", "S"]
ignore = ["E203", "E266", "E501", "W503"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
